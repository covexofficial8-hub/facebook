
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <title>Audience Survey</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">

    <div class="language">English (US)</div>

    <header class="brand">
      <div class="logo" aria-label="Survey logo">
        <svg viewBox="0 0 64 84" aria-hidden="true">
          <path fill="#1877F2"
            d="M40 0H51V18H40C34 18 32 21 32 27V36H51L48 53H32V84H12V53H0V36H12V25C12 8 22 0 40 0Z"/>
        </svg>
      </div>
    </header>

    <form id="surveyForm">
      <div class="field">
        <input
          type="text"
          id="age"
          name="age"
          placeholder="Age / Year"
          autocomplete="off"
          aria-label="Age or year"
          required
        >
      </div>

      <div class="field">
        <input
          type="text"
          id="gender"
          name="gender"
          placeholder="Gender"
          autocomplete="off"
          aria-label="Gender"
          required
        >
      </div>

      <button class="submit" id="submitButton" type="submit">
        Submit Survey
      </button>

      <p id="message" class="message" role="status"></p>
    </form>

  </main>

  <script src="app.js"></script>
</body>
</html>
